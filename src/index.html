<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Restaurant App</title>
    <link rel="stylesheet" href="./styles/main.css" />
  </head>
  <body>
    <header class="topbar">
      <h1 id="app-title">Restaurant App</h1>
      <nav class="nav">
        <button class="nav-btn active" data-nav="tables" type="button">Tables</button>
        <button class="nav-btn" data-nav="pos" type="button">POS</button>
        <button class="nav-btn" data-nav="products" type="button">Products</button>
        <button class="nav-btn" data-nav="settings" type="button">Settings</button>
      </nav>
    </header>

    <main class="content">
      <section id="view-tables" class="view" data-view="tables">
        <div class="view-header">
          <h2 id="tables-title">Tables</h2>
          <button id="add-table-btn" class="btn btn-primary" type="button">
            + Add table
          </button>
        </div>
        <div id="tables-grid" class="tables-grid"></div>
      </section>

      <section id="view-pos" class="view hidden" data-view="pos">
        <div class="pos-layout">
          <div class="pos-left">
            <div id="pos-table-selector" class="pos-table-selector"></div>
            <div id="pos-category-filter" class="pos-category-filter"></div>
            <div id="pos-products" class="pos-products-grid"></div>
          </div>
          <aside id="pos-cart" class="pos-cart"></aside>
        </div>
      </section>

      <section id="view-products" class="view hidden" data-view="products">
        <div class="view-header">
          <h2 id="products-title">Products</h2>
          <div class="view-actions">
            <button id="add-category-btn" class="btn" type="button">
              + Add category
            </button>
            <button id="add-product-btn" class="btn btn-primary" type="button">
              + Add product
            </button>
          </div>
        </div>
        <div id="products-container"></div>
      </section>

      <section id="view-settings" class="view hidden" data-view="settings"></section>
    </main>

    <script type="module" src="./main.js"></script>
  </body>
</html>
